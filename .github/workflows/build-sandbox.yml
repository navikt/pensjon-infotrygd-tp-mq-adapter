name: Build and Deploy Sandbox

on:
  push:
    branches: [sandbox]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build and test
        run: ./mvnw verify --no-transfer-progress
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/adapter*.jar
          retention-days: 1

  build-image:
    name: Build Image (sandbox)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        id: version
        run: echo "version=$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Build and push image
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: pensjonsamhandling
          tag: ${{ github.event.repository.name }}-sandbox
          image_suffix: sandbox

  deploy-sandbox:
    name: Deploy Sandbox (${{ matrix.env }})
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        env: [q1, q2]
    steps:
      - uses: actions/checkout@v7
      - uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          RESOURCE: .nais/nais.yaml
          CLUSTER: dev-fss
          VAR: version=${{ needs.build-image.outputs.version }}
          VARS: .nais/vars-dev-${{ matrix.env }}.yaml
